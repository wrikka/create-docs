name: Cleanup npm packages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to actually unpublish packages (default is dry run)'
        required: false
        default: ''

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm token
        run: npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}

      - name: List packages
        id: list
        run: |
          echo "=== Personal packages (newkub) ==="
          npm access list packages newkub --json || echo '{}'
          echo "=== Org packages (wrikka) ==="
          npm access list packages wrikka --json || echo '{}'

      - name: Dry run - packages to delete
        if: github.event.inputs.confirm != 'DELETE'
        run: |
          echo "Dry run: the packages below would be deleted if you run with confirm=DELETE"
          echo "(excluding @wrikka/create-docs)"
          npm access list packages newkub --json | jq -r 'keys[]' | grep -v '^@wrikka/create-docs$' || true
          npm access list packages wrikka --json | jq -r 'keys[]' | grep -v '^@wrikka/create-docs$' || true

      - name: Delete packages
        if: github.event.inputs.confirm == 'DELETE'
        run: |
          set +e
          npm access list packages newkub --json | jq -r 'keys[]' | grep -v '^@wrikka/create-docs$' > packages.txt
          npm access list packages wrikka --json | jq -r 'keys[]' | grep -v '^@wrikka/create-docs$' >> packages.txt
          if [ ! -s packages.txt ]; then
            echo "No packages to delete."
            exit 0
          fi
          echo "Deleting packages:"
          cat packages.txt
          while IFS= read -r pkg; do
            echo "Unpublishing $pkg"
            npm unpublish "$pkg" --force || echo "Failed to unpublish $pkg"
          done < packages.txt
          rm packages.txt
